name: ci

on:
  push:
    branches:
      - master
      - codex/**
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Smoke API
        run: ./scripts/smoke_api.sh
